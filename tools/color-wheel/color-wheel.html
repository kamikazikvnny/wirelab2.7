<main class="color-wheel-page">

    <img
        src="../../z-images/color-wheel.png"
        class="color-wheel"
        alt="Ohm's Law and Power Color Wheel"
    >





    
<svg
    class="wheel-hotspots"
    viewBox="0 0 1254 1254"
    preserveAspectRatio="xMidYMid meet"
    aria-label="Interactive electrical equations"
>
    <!-- POWER -->
    <polygon class="wheel-hotspot" data-equation="E × I"
    points="44,622 96,372 398,512 380,620" />

    <polygon
        class="wheel-hotspot"
        data-equation="R × I²"
        points="93,374 310,126 489,400 400,512"
    />

    <polygon
        class="wheel-hotspot"
        data-equation="E² / R"
        points="308,130 627,31 625,353 489,396"
    />

    <!-- VOLTAGE -->
    <polygon
        class="wheel-hotspot"
        data-equation="R × I"
        points="625,30 953,140 766,397 628,354"
    />

    <polygon
        class="wheel-hotspot"
        data-equation="P / I"
        points="957,142 1147,385 853,513 768,397"
    />

    <polygon
        class="wheel-hotspot"
        data-equation="√(P × R)"
        points="854,514 1146,382 1192,622 872,620"
    />

    <!-- RESISTANCE -->
    <polygon
        class="wheel-hotspot"
        data-equation="E / I"
        points="871,622 1192,622 1068,961 834,749"
    />

    <polygon
        class="wheel-hotspot"
        data-equation="E² / P"
        points="834,751 1069,960 885,1128 734,838"
    />

    <polygon
        class="wheel-hotspot"
        data-equation="P / I²"
        points="628,863 626,1204 892,1145 732,840"
    />

    <!-- CURRENT -->
    <polygon
        class="wheel-hotspot"
        data-equation="E / R"
        points="626,863 628,1210 362,1127 522,840"
    />

    <polygon
        class="wheel-hotspot"
        data-equation="P / E"
        points="520,841 356,1131 161,959 418,748"
    />

    <polygon
        class="wheel-hotspot"
        data-equation="√(P / R)"
        points="418,745 164,960 42,621 380,620"
    />
</svg>
